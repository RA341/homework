[project]
name = "homweork.downloader"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.18.4",
    # required version pinned by ytdlp check again in future
    "curl-cffi>=0.10.0,<0.15.0",
    "fastapi>=0.138.0",
    "httpx>=0.28.1",
    "instaloader>=4.15.1",
    "pydantic>=2.13.4",
    "pyyaml>=6.0.1",
    "scalar-fastapi>=1.8.2",
    "sqlalchemy>=2.0.51",
    "sse-starlette>=3.4.5",
    "uvicorn>=0.49.0",
    "yt-dlp>=2026.6.9",
]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "ruff>=0.15.18",
]

[tool.mypy]
exclude = ["ui/"]
