[project]
name = "homweork.downloader"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "alembic==1.19.1",
    # required version pinned by ytdlp check again in future
    "curl-cffi==0.15.0",
    "fastapi==0.141.1",
    "httpx>=0.28.1",
    "instaloader==4.15.3",
    "playwright>=1.62.0",
    "pydantic>=2.13.4",
    "pyyaml>=6.0.1",
    "requests==2.34.2",
    "scalar-fastapi>=1.8.2",
    "sqlalchemy==2.0.52",
    "sse-starlette==3.4.8",
    "uvicorn==0.52.4",
    "yt-dlp==2026.7.4",
]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "ruff>=0.15.18",
]

[tool.mypy]
exclude = ["ui/"]
