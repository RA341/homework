name: homework-lite
services:
  hw-core:
    container_name: homework-core
    #    image: ghcr.io/ra341/homework/core:latest
    image: homework:core-latest
    ports:
      - "9911:9911"
    environment:
      - PUID=1000
      - PGID=1000
      - HW_JWT_SECRET=somehighentroupesecret
    volumes:
      - ./test/appdata:/data
      - ./test/browser:/browser
      - ./test/assets:/assets
      - ./test/downloads:/downloads
    restart: unless-stopped
    depends_on:
      browser:
        condition: service_started

  hw-scribe:
