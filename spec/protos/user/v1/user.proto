syntax = "proto3";

package user.v1;

option go_package = "github.com/ra341/homework/generated/api/user/v1";

service UserService {
  rpc Self(SelfRequest) returns (SelfResponse) {}
}

message SelfRequest {}

message SelfResponse {
  User user = 1;
}

message User {
  uint64 userId = 1;
  string username = 2;
}