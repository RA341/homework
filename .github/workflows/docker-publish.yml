name: Build and Push Docker Images

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'core/**'
      - 'frontend/**'
      - 'docker/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Tags and Format Registry
        id: meta
        run: |
          # Lowercase repository name for GHCR
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          REGISTRY="ghcr.io/${REPO_LOWER}"
          
          # Generate tag list based on ref
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            TAGS="${GITHUB_REF_NAME},${VERSION},latest"
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            TAGS="latest,main,sha-${GITHUB_SHA::7}"
          else
            TAGS="dev,sha-${GITHUB_SHA::7}"
          fi
          
          echo "registry=${REGISTRY}" >> "$GITHUB_OUTPUT"
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          
          echo "Registry: ${REGISTRY}"
          echo "Tags: ${TAGS}"

      - name: Build and Push Images
        env:
          REGISTRY: ${{ steps.meta.outputs.registry }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          docker buildx bake -f docker/docker-bake.hcl default --push
